name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  # A newer push to the same branch or PR supersedes the running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run format:check

      # The build catches what tsc cannot: broken static generation, missing
      # exports in route files, metadata mistakes. It is also what Amplify runs.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
